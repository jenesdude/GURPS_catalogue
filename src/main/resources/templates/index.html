<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GURPS Characters</title>
</head>
<body>
<h1>Персонажи GURPS</h1>
<p th:if="${#lists.isEmpty(characters)}">Пока нет ни одного персонажа.</p>
<ul th:unless="${#lists.isEmpty(characters)}">
    <li th:each="c : ${characters}">
        <a th:href="@{/characters/{id}(id=${c.id})}" th:text="${c.name}">Имя</a>
    </li>
</ul>
<a th:href="@{/characters/new}">Создать персонажа</a>
</body>
</html>
